<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小江&甜甜 · 管理后台</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --line: #e3e5e9;
    --text: #1f2228;
    --muted: #7a8290;
    --accent: #5b6ee1;
    --accent-soft: #eef0fd;
    --danger: #d94a4a;
    --danger-soft: #fdeeee;
    --ok: #2f9e6a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ------------------------------ 布局 ------------------------------ */
  header {
    background: #262a33;
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: #9aa3b2; font-size: 13px; }
  header .spacer { flex: 1; }
  header .stamp { color: #9aa3b2; font-size: 12px; }

  .wrap { display: flex; min-height: calc(100vh - 52px); }

  nav {
    width: 148px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 12px 0;
    position: sticky;
    top: 52px;
    height: calc(100vh - 52px);
    overflow-y: auto;
  }
  nav button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 20px;
    border: 0;
    background: none;
    font: inherit;
    color: var(--muted);
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  nav button:hover { background: #fafbfc; color: var(--text); }
  nav button.on {
    color: var(--accent);
    background: var(--accent-soft);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  nav .count {
    float: right;
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
  }

  main { flex: 1; padding: 20px 24px 60px; min-width: 0; }

  .bars { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .bars h2 { font-size: 17px; margin: 0; font-weight: 600; }
  .bars .spacer { flex: 1; }

  /* ------------------------------ 控件 ------------------------------ */
  button.btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 7px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font: inherit;
  }
  button.btn:hover { border-color: #c9cdd5; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.primary:hover { background: #4d5fcc; }
  button.btn.danger { color: var(--danger); border-color: #f0c8c8; }
  button.btn.danger:hover { background: var(--danger-soft); }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }

  input[type=text], input[type=number], input[type=date], textarea, select {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 7px 10px;
    font: inherit;
    background: var(--panel);
    color: var(--text);
    width: 100%;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { resize: vertical; min-height: 68px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card .row { display: flex; align-items: flex-start; gap: 12px; }
  .card .grow { flex: 1; min-width: 0; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card .body { margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
  .card .acts { display: flex; gap: 8px; flex-shrink: 0; }
  .card.done { opacity: .62; }
  .card.done .title { text-decoration: line-through; }

  .title { font-weight: 600; }
  .tag {
    display: inline-block;
    font-size: 12px;
    padding: 1px 7px;
    border-radius: 20px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-left: 6px;
    vertical-align: 1px;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
  .shot {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .shot img {
    display: block;
    width: 100%;
    height: 132px;
    object-fit: cover;
    background: #eceef1;
    cursor: zoom-in;
  }
  .shot .info { padding: 8px 10px; font-size: 12px; color: var(--muted); }
  .shot .info .who { color: var(--text); }
  .shot .info .tools { margin-top: 6px; display: flex; gap: 6px; }
  .shot .info .tools button { font-size: 12px; padding: 3px 9px; }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .loading { color: var(--muted); padding: 24px 0; }

  /* 大图查看 */
  .lightbox {
    position: fixed; inset: 0; background: rgba(18,20,24,.9);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 32px; cursor: zoom-out;
  }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }

  /* 弹窗 */
  .modal {
    position: fixed; inset: 0; background: rgba(18,20,24,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 110; padding: 20px;
  }
  .modal .box {
    background: var(--panel);
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 440px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #262a33; color: #fff; padding: 10px 20px;
    border-radius: 24px; font-size: 13px; z-index: 200;
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }
  .toast.err { background: var(--danger); }

  .keygate {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(20,22,26,.55); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .keygate-box {
    background: var(--panel, #fff); border-radius: 16px; padding: 26px 24px;
    width: 100%; max-width: 380px; box-shadow: 0 18px 50px rgba(0,0,0,.28);
  }
  .keygate-box h2 { margin: 0 0 10px; font-size: 17px; }
  .keygate-hint { margin: 0 0 14px; font-size: 12px; line-height: 1.6; color: var(--muted); }
  .keygate-err { margin: 0 0 12px; font-size: 12px; color: var(--danger); }
  .keygate-box input {
    width: 100%; box-sizing: border-box; padding: 11px 13px; font-size: 14px;
    border: 1px solid var(--line, #dcdfe6); border-radius: 10px; margin-bottom: 14px;
    font-family: inherit;
  }
  .keygate-box .btn { width: 100%; justify-content: center; }
</style>
</head>
<body>

<header>
  <h1>小江&amp;甜甜</h1>
  <span class="sub">管理后台</span>
  <span class="spacer"></span>
  <button class="btn" id="chgkey" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)" title="清除本机保存的密钥，重新输入">换密钥</button>
  <span class="stamp" id="stamp"></span>
</header>

<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"><div class="loading">正在加载…</div></main>
</div>

<script>
/* ============================== 基础 ============================== */

/* 管理密钥不再写死在源码里（源码会公开）。
   首次打开时让使用者粘贴自己部署时设置的 APP_KEY，存在浏览器 localStorage。
   换密钥/换浏览器 → 点右上角「换密钥」重新输入。 */
const KEY_STORE = 'qlapp-admin-key';
let KEY = localStorage.getItem(KEY_STORE) || '';

/** 统一请求。失败时抛出后端返回的中文错误，交给调用方 toast。 */
async function api(method, path, body) {
  const opt = { method, headers: { 'X-App-Key': KEY } };
  if (body !== undefined) {
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  const res = await fetch('/api' + path, opt);
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch (e) { /* 非 JSON 就当空 */ }
  if (res.status === 401) {
    // 密钥不对（或后台改了密钥）→ 清掉本地存的，让用户重新输入
    localStorage.removeItem(KEY_STORE);
    KEY = '';
    showKeyGate('密钥不对，请重新输入');
  }
  if (!res.ok) throw new Error(data.error || ('请求失败 HTTP ' + res.status));
  return data;
}

/* 密钥闸门：没密钥就挡住整个后台，先要用户粘贴自己部署时设置的 APP_KEY。 */
function showKeyGate(errMsg) {
  document.querySelectorAll('.keygate').forEach(el => el.remove());
  const input = h('input', { type: 'password', placeholder: '粘贴你部署时设置的 APP_KEY' });
  input.value = '';
  const gate = h('div', { class: 'keygate' }, [
    h('div', { class: 'keygate-box' }, [
      h('h2', { text: '输入管理密钥' }),
      h('p', { class: 'keygate-hint', text: '这是你部署后端时用 wrangler secret put APP_KEY 设置的密钥。只存在本机浏览器，不会上传。' }),
      errMsg ? h('p', { class: 'keygate-err', text: errMsg }) : null,
      input,
      h('button', {
        class: 'btn primary', text: '进入后台',
        onclick: () => {
          const v = input.value.trim();
          if (!v) { input.focus(); return; }
          KEY = v;
          localStorage.setItem(KEY_STORE, v);
          gate.remove();
          refresh();
        },
      }),
    ].filter(Boolean)),
  ]);
  gate.addEventListener('keydown', e => { if (e.key === 'Enter') gate.querySelector('button').click(); });
  document.body.appendChild(gate);
  input.focus();
}

function h(tag, attrs, children) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') el.className = attrs[k];
    else if (k === 'text') el.textContent = attrs[k];
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) el.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
  return el;
}

let toastTimer = null;
function toast(msg, isErr) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  clearTimeout(toastTimer);
  const el = h('div', { class: 'toast' + (isErr ? ' err' : ''), text: msg });
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), isErr ? 4200 : 2000);
}

function fmt(ts) {
  if (!ts) return '';
  const d = new Date(Number(ts));
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function dayOf(ts) {
  const d = new Date(Number(ts));
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/** 弹窗。fields 形如 [{key,label,type,value,placeholder,options}]，返回对象或 null。 */
function modal(title, fields, confirmText) {
  return new Promise(resolve => {
    const inputs = {};
    const box = h('div', { class: 'box' }, [h('h3', { text: title })]);
    fields.forEach(f => {
      box.appendChild(h('label', { text: f.label }));
      let el;
      if (f.type === 'select') {
        el = h('select', {});
        (f.options || []).forEach(o => {
          const opt = h('option', { value: o.value, text: o.label });
          if (o.value === f.value) opt.selected = true;
          el.appendChild(opt);
        });
      } else if (f.type === 'textarea') {
        el = h('textarea', { placeholder: f.placeholder || '', rows: 5 });
        el.value = f.value || '';
      } else {
        el = h('input', { type: f.type || 'text', placeholder: f.placeholder || '' });
        el.value = f.value !== undefined && f.value !== null ? f.value : '';
      }
      inputs[f.key] = el;
      box.appendChild(el);
    });
    box.appendChild(h('div', { class: 'foot' }, [
      h('button', { class: 'btn', text: '取消', onclick: () => close(null) }),
      h('button', {
        class: 'btn primary', text: confirmText || '确定',
        onclick: () => {
          const out = {};
          for (const k in inputs) out[k] = inputs[k].value.trim();
          close(out);
        },
      }),
    ]));
    const back = h('div', { class: 'modal', onclick: e => { if (e.target === back) close(null); } }, [box]);
    function close(v) { back.remove(); document.removeEventListener('keydown', esc); resolve(v); }
    function esc(e) { if (e.key === 'Escape') close(null); }
    document.addEventListener('keydown', esc);
    document.body.appendChild(back);
    const first = Object.values(inputs)[0];
    if (first) first.focus();
  });
}

/** 心情下拉的选项，写日记/改日记共用。 */
const MOOD_OPTIONS = [
  { value: 'happy', label: '😊 开心' },
  { value: 'miss', label: '🥰 想你' },
  { value: 'calm', label: '😐 平静' },
  { value: 'sad', label: '😢 难过' },
  { value: 'angry', label: '😠 生气' },
];

/** 游戏下拉的选项，和客户端的三款游戏对应。 */
const GAME_OPTIONS = [
  { value: 'air', label: '打飞机' },
  { value: 'piano', label: '钢琴块' },
  { value: 'runner', label: '跑酷' },
];

/* ============================== 状态 ============================== */

const state = {
  tab: 'overview',
  tasks: [], photos: [], messages: [], diary: [], games: [],
  settings: { nicknames: {}, anniversary: null, devices: [] },
};

/** 某台装置显示成什么名字：有昵称用昵称，否则退化成短 ID。 */
function nameOf(deviceId) {
  if (!deviceId) return '未知';
  const n = state.settings.nicknames[deviceId];
  return n || ('装置 ' + deviceId.slice(0, 6));
}

/** 所有已知装置：设置里记着的 + 日记/留言里出现过的。 */
function allDevices() {
  const set = new Set(state.settings.devices || []);
  state.diary.forEach(e => { if (e.deviceId) set.add(e.deviceId); });
  state.messages.forEach(m => { if (m.deviceId) set.add(m.deviceId); });
  return [...set];
}

/**
 * 「我是谁」——网页新建内容时的默认署名。
 *
 * 取第一个已有昵称的装置。网页本身没有身份，所以这只是个省事的默认值，
 * 弹窗里可以随时改掉。
 */
function myName() {
  const ids = allDevices();
  for (const d of ids) {
    const n = state.settings.nicknames[d];
    if (n) return n;
  }
  return '我';
}

const TABS = [
  { id: 'overview', label: '总览' },
  { id: 'photos', label: '相册' },
  { id: 'tasks', label: '任务' },
  { id: 'diary', label: '日记' },
  { id: 'messages', label: '留言' },
  { id: 'games', label: '游戏' },
];

/* ============================== 加载 ============================== */

async function loadAll() {
  const [t, p, m, d, g, s] = await Promise.all([
    api('GET', '/tasks'),
    api('GET', '/photos'),
    api('GET', '/messages'),
    api('GET', '/diary?all=1'),
    api('GET', '/game-records'),
    api('GET', '/settings'),
  ]);
  state.tasks = t.tasks || [];
  state.photos = p.photos || [];
  state.messages = m.messages || [];
  state.diary = d.entries || [];
  state.games = g.records || [];
  state.settings = {
    nicknames: s.nicknames || {},
    anniversary: s.anniversary,
    devices: s.devices || [],
  };
  document.getElementById('stamp').textContent = '更新于 ' + fmt(Date.now());
}

async function refresh() {
  try {
    await loadAll();
    render();
  } catch (e) {
    toast(e.message, true);
  }
}

/* ============================== 渲染 ============================== */

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const counts = {
    photos: state.photos.length,
    tasks: state.tasks.length,
    diary: state.diary.length,
    messages: state.messages.length,
    games: state.games.length,
  };
  TABS.forEach(t => {
    const b = h('button', {
      class: state.tab === t.id ? 'on' : '',
      onclick: () => { state.tab = t.id; render(); },
    }, [document.createTextNode(t.label)]);
    if (counts[t.id] !== undefined) {
      b.appendChild(h('span', { class: 'count', text: String(counts[t.id]) }));
    }
    nav.appendChild(b);
  });
}

function render() {
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = '';
  ({
    overview: renderOverview,
    photos: renderPhotos,
    tasks: renderTasks,
    diary: renderDiary,
    messages: renderMessages,
    games: renderGames,
  })[state.tab](main);
}

function bars(main, title, actions) {
  const b = h('div', { class: 'bars' }, [h('h2', { text: title }), h('span', { class: 'spacer' })]);
  (actions || []).forEach(a => b.appendChild(a));
  main.appendChild(b);
}

function emptyBox(main, text) {
  main.appendChild(h('div', { class: 'empty', text: text }));
}

/* ------------------------------ 总览 ------------------------------ */

function renderOverview(main) {
  bars(main, '总览');

  const doneCount = state.tasks.filter(t => !!t.done).length;
  const stats = [
    ['相册', state.photos.length + ' 张'],
    ['任务', state.tasks.length + ' 条'],
    ['日记', state.diary.length + ' 篇'],
    ['留言', state.messages.length + ' 条'],
    ['游戏纪录', state.games.length + ' 项'],
  ];

  const grid = h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px' });
  stats.forEach(([k, v]) => {
    grid.appendChild(h('div', { class: 'card', style: 'margin:0' }, [
      h('div', { class: 'meta', text: k }),
      h('div', { style: 'font-size:22px;font-weight:600;margin-top:4px', text: v }),
    ]));
  });
  main.appendChild(grid);

  // 我们的信息
  const devices = allDevices();
  main.appendChild(h('div', { class: 'card', style: 'margin-top:16px' }, [
    h('div', { class: 'title', text: '我们的信息' }),
    h('div', { class: 'meta', text: '昵称按人存，改完手机上也会同步' }),
    h('div', { style: 'display:flex;gap:24px;margin-top:12px;flex-wrap:wrap' }, [
      h('div', {}, [
        h('div', { class: 'meta', text: '昵称' }),
        h('div', {
          style: 'font-weight:600',
          text: devices.length ? devices.map(nameOf).join(' / ') : '还没设置',
        }),
      ]),
      h('div', {}, [
        h('div', { class: 'meta', text: '纪念日' }),
        h('div', {
          style: 'font-weight:600',
          text: state.settings.anniversary ? dayOf(state.settings.anniversary) : '还没设置',
        }),
      ]),
      h('div', {}, [
        h('div', { class: 'meta', text: '已完成任务' }),
        h('div', { style: 'font-weight:600', text: doneCount + ' 条' }),
      ]),
    ]),
    h('div', { style: 'margin-top:16px;display:flex;gap:8px;flex-wrap:wrap' }, [
      h('button', {
        class: 'btn primary', text: '改昵称 / 纪念日',
        onclick: async () => {
          if (!devices.length) {
            toast('还没有任何数据，先在手机上写篇日记或留个言，这里才能认到人', true);
            return;
          }
          const fields = devices.map((d, i) => ({
            key: 'nick' + i,
            label: '昵称 · ' + (state.settings.nicknames[d] || '装置 ' + d.slice(0, 6)),
            value: state.settings.nicknames[d] || '',
            placeholder: '比如：小江',
          }));
          fields.push({
            key: 'anniversary',
            label: '纪念日（留空表示不改）',
            type: 'date',
            value: state.settings.anniversary ? dayOf(state.settings.anniversary) : '',
          });
          const r = await modal('我们的信息', fields, '保存');
          if (!r) return;

          const body = {};
          const names = {};
          devices.forEach((d, i) => {
            const v = r['nick' + i];
            if (v) names[d] = v;
          });
          if (Object.keys(names).length) body.nicknames = names;
          if (r.anniversary) {
            // date input 给 yyyy-MM-dd，转成本地零点时间戳
            const parts = r.anniversary.split('-').map(Number);
            body.anniversary = new Date(parts[0], parts[1] - 1, parts[2]).getTime();
          }
          if (!Object.keys(body).length) return;
          try {
            await api('PUT', '/settings', body);
            toast('已保存');
            refresh();
          } catch (e) { toast(e.message, true); }
        },
      }),
      h('button', {
        class: 'btn danger', text: '清空已完成任务',
        disabled: doneCount === 0,
        onclick: async () => {
          if (!confirm('把 ' + doneCount + ' 条已完成的任务全删掉？删了找不回来。')) return;
          try {
            for (const t of state.tasks.filter(x => !!x.done)) {
              await api('DELETE', '/tasks/' + t.id);
            }
            toast('已清空');
            refresh();
          } catch (e) { toast(e.message, true); }
        },
      }),
      h('button', {
        class: 'btn', text: '导出备份',
        onclick: () => exportBackup(),
      }),
    ]),
  ]));
}

/** 拼一份纯文本备份并下载，和手机上那个导出口径一致。 */
function exportBackup() {
  const L = [];
  L.push('小江&甜甜 · 数据备份');
  L.push('导出时间：' + fmt(Date.now()));
  if (state.settings.anniversary) L.push('纪念日：' + dayOf(state.settings.anniversary));
  L.push('');

  L.push('【日记】共 ' + state.diary.length + ' 条');
  if (!state.diary.length) L.push('（还没有）');
  else {
    state.diary.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).forEach(e => {
      L.push((e.author || '我') + ' · ' + e.date + ' · ' + moodLabel(e.mood));
      L.push('  ' + (e.content || '（没写内容）'));
    });
  }
  L.push('');

  L.push('【留言】共 ' + state.messages.length + ' 条');
  if (!state.messages.length) L.push('（还没有）');
  else state.messages.forEach(m => {
    L.push((m.author || '我') + ' · ' + fmt(m.createdAt));
    L.push('  ' + m.content);
  });
  L.push('');

  L.push('【任务】共 ' + state.tasks.length + ' 条（已完成 ' + state.tasks.filter(t => !!t.done).length + '）');
  if (!state.tasks.length) L.push('（还没有）');
  else state.tasks.forEach(t => {
    L.push((t.done ? '[x] ' : '[ ] ') + t.title + (t.done && t.done_by ? ' · ' + t.done_by + '完成' : ''));
    if (t.note) L.push('    ' + t.note);
  });
  L.push('');

  L.push('【相册】共 ' + state.photos.length + ' 张（图片本身在云端，这里只记索引）');
  if (!state.photos.length) L.push('（还没有）');
  else state.photos.forEach(p => {
    L.push((p.uploaded_by || '我') + ' · ' + dayOf(p.created_at) + (p.caption ? ' · ' + p.caption : ''));
  });
  L.push('');

  L.push('【游戏纪录】');
  if (!state.games.length) L.push('（还没有）');
  else state.games.forEach(g => L.push(gameLabel(g.game) + '：' + g.score + ' 分（' + g.owner + '）'));

  const blob = new Blob([L.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '小江和甜甜-备份-' + dayOf(Date.now()) + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('已下载备份');
}

function moodLabel(code) {
  return { happy: '开心', miss: '想你', calm: '平静', sad: '难过', angry: '生气' }[code] || code;
}
function moodEmoji(code) {
  return { happy: '😊', miss: '🥰', calm: '😐', sad: '😢', angry: '😠' }[code] || '·';
}
function gameLabel(g) {
  return { air: '打飞机', piano: '钢琴块', runner: '跑酷' }[g] || g;
}

/* ------------------------------ 相册 ------------------------------ */

function renderPhotos(main) {
  const fileInput = h('input', {
    type: 'file', accept: 'image/*', multiple: '', style: 'display:none',
    onchange: e => uploadPhotos(e.target.files),
  });
  main.appendChild(fileInput);

  bars(main, '相册 ' + state.photos.length + ' 张', [
    h('button', { class: 'btn primary', text: '上传照片', onclick: () => fileInput.click() }),
  ]);

  if (!state.photos.length) return emptyBox(main, '还没有照片');

  const grid = h('div', { class: 'grid' });
  state.photos.forEach(p => {
    const img = h('img', {
      src: '/api/photos/' + p.id + '/raw?key=' + KEY,
      loading: 'lazy',
      alt: p.caption || '照片',
      onclick: () => lightbox('/api/photos/' + p.id + '/raw?key=' + KEY),
    });
    const info = h('div', { class: 'info' }, [
      h('div', { class: 'who', text: (p.uploaded_by || '我') + ' · ' + dayOf(p.created_at) }),
      p.caption ? h('div', { text: p.caption }) : null,
      h('div', { class: 'tools' }, [
        h('button', {
          class: 'btn', text: '改说明',
          onclick: async () => {
            const r = await modal('照片说明', [
              { key: 'caption', label: '说明文字', value: p.caption || '', placeholder: '比如：海边那天' },
            ], '保存');
            if (!r) return;
            try {
              await api('PATCH', '/photos/' + p.id, { caption: r.caption });
              toast('已保存');
              refresh();
            } catch (e) { toast(e.message, true); }
          },
        }),
        h('button', {
          class: 'btn danger', text: '删',
          onclick: async () => {
            if (!confirm('删掉这张照片？图片会从云端一起删掉，找不回来。')) return;
            try {
              await api('DELETE', '/photos/' + p.id);
              toast('已删除');
              refresh();
            } catch (e) { toast(e.message, true); }
          },
        }),
      ]),
    ].filter(Boolean));
    grid.appendChild(h('div', { class: 'shot' }, [img, info]));
  });
  main.appendChild(grid);
}

function lightbox(src) {
  const back = h('div', { class: 'lightbox', onclick: () => back.remove() }, [h('img', { src: src })]);
  document.body.appendChild(back);
}

async function uploadPhotos(files) {
  if (!files || !files.length) return;
  const list = Array.from(files);
  toast('开始上传 ' + list.length + ' 张…');
  let ok = 0, fail = 0;
  for (const f of list) {
    const fd = new FormData();
    fd.append('file', f);
    fd.append('caption', '');
    fd.append('by', myName());
    try {
      const res = await fetch('/api/photos', { method: 'POST', headers: { 'X-App-Key': KEY }, body: fd });
      if (res.ok) ok++; else fail++;
    } catch (e) { fail++; }
  }
  toast(fail ? ('上传完成：成功 ' + ok + ' 张，失败 ' + fail + ' 张') : ('已上传 ' + ok + ' 张'), fail > 0);
  refresh();
}

/* ------------------------------ 任务 ------------------------------ */

function renderTasks(main) {
  const doneCount = state.tasks.filter(t => !!t.done).length;
  bars(main, '任务 ' + state.tasks.length + ' 条（已完成 ' + doneCount + '）', [
    h('button', {
      class: 'btn primary', text: '加任务',
      onclick: async () => {
        const r = await modal('新建任务', [
          { key: 'title', label: '任务内容' },
          { key: 'note', label: '备注（可空）' },
        ], '创建');
        if (!r || !r.title) return;
        try {
          await api('POST', '/tasks', { title: r.title, note: r.note, by: myName() });
          toast('已创建');
          refresh();
        } catch (e) { toast(e.message, true); }
      },
    }),
  ]);

  if (!state.tasks.length) return emptyBox(main, '还没有任务');

  state.tasks.forEach(t => {
    main.appendChild(h('div', { class: 'card' + (t.done ? ' done' : '') }, [
      h('div', { class: 'row' }, [
        h('div', { class: 'grow' }, [
          h('div', {}, [
            h('span', { class: 'title', text: t.title }),
            t.done ? h('span', { class: 'tag', text: (t.done_by || '') + ' 完成' }) : null,
          ].filter(Boolean)),
          t.note ? h('div', { class: 'body', text: t.note }) : null,
          h('div', { class: 'meta', text: (t.created_by || '我') + ' 建于 ' + fmt(t.created_at) }),
        ].filter(Boolean)),
        h('div', { class: 'acts' }, [
          h('button', {
            class: 'btn', text: t.done ? '撤销完成' : '标记完成',
            onclick: async () => {
              try {
                await api('PATCH', '/tasks/' + t.id, {
                  done: !t.done, by: myName(),
                });
                refresh();
              } catch (e) { toast(e.message, true); }
            },
          }),
          h('button', {
            class: 'btn', text: '编辑',
            onclick: async () => {
              const r = await modal('编辑任务', [
                { key: 'title', label: '任务内容', value: t.title },
                { key: 'note', label: '备注', type: 'textarea', value: t.note || '' },
              ], '保存');
              if (!r || !r.title) return;
              try {
                await api('PATCH', '/tasks/' + t.id, { title: r.title, note: r.note });
                toast('已保存');
                refresh();
              } catch (e) { toast(e.message, true); }
            },
          }),
          h('button', {
            class: 'btn danger', text: '删',
            onclick: async () => {
              if (!confirm('删掉「' + t.title + '」？')) return;
              try {
                await api('DELETE', '/tasks/' + t.id);
                toast('已删除');
                refresh();
              } catch (e) { toast(e.message, true); }
            },
          }),
        ]),
      ]),
    ]));
  });
}

/* ------------------------------ 日记 ------------------------------ */

function renderDiary(main) {
  bars(main, '日记 ' + state.diary.length + ' 篇', [
    h('button', {
      class: 'btn primary', text: '写日记',
      onclick: async () => {
        // 日记归属靠署名（身份名：小江 / 甜甜）。网页没有身份，所以让用户挑「代谁写」——
        // 候选 = 设置里的昵称 + 历史上出现过的署名，一般正好是那两个人。
        const people = [];
        const push = (v) => { if (v && !people.some(p => p.value === v)) people.push({ value: v, label: v }); };
        Object.values(state.settings.nicknames || {}).forEach(push);
        state.diary.forEach(e => push(e.author));
        state.messages.forEach(m => push(m.author));
        push(myName());
        if (!people.length) people.push({ value: '我', label: '我' });

        const r = await modal('写日记', [
          { key: 'date', label: '日期', type: 'date', value: dayOf(Date.now()) },
          { key: 'author', label: '以谁的身份写', type: 'select', options: people, value: people[0].value },
          { key: 'mood', label: '心情', type: 'select', options: MOOD_OPTIONS, value: 'happy' },
          { key: 'content', label: '内容', type: 'textarea' },
        ], '保存');
        if (!r || !r.date) return;
        try {
          await api('PUT', '/diary/' + r.date + '?author=' + encodeURIComponent(r.author), {
            mood: r.mood || 'happy', content: r.content, by: r.author,
          });
          toast('已保存');
          refresh();
        } catch (e) { toast(e.message, true); }
      },
    }),
  ]);

  if (!state.diary.length) return emptyBox(main, '还没有日记');

  const sorted = state.diary.slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  sorted.forEach(e => {
    main.appendChild(h('div', { class: 'card' }, [
      h('div', { class: 'row' }, [
        h('div', { class: 'grow' }, [
          h('div', {}, [
            h('span', { text: moodEmoji(e.mood) }),
            h('span', { class: 'title', text: ' ' + (e.author || '我') }),
            h('span', { class: 'tag', text: e.date }),
          ]),
          h('div', { class: 'body', text: e.content || '（没写内容）' }),
          h('div', { class: 'meta', text: '心情：' + moodLabel(e.mood) + ' · 改于 ' + fmt(e.updatedAt) }),
        ]),
        h('div', { class: 'acts' }, [
          h('button', {
            class: 'btn', text: '编辑',
            onclick: async () => {
              const r = await modal('编辑日记 · ' + e.date, [
                { key: 'author', label: '署名', value: e.author || '' },
                { key: 'mood', label: '心情', type: 'select', options: MOOD_OPTIONS, value: e.mood },
                { key: 'content', label: '内容', type: 'textarea', value: e.content || '' },
              ], '保存');
              if (!r) return;
              try {
                // 带上原署名，才是改这一条而不是新建一条
                await api('PUT', '/diary/' + e.date + '?author=' + encodeURIComponent(e.author || ''), {
                  mood: r.mood, content: r.content, by: r.author,
                });
                toast('已保存');
                refresh();
              } catch (err) { toast(err.message, true); }
            },
          }),
          h('button', {
            class: 'btn danger', text: '删',
            onclick: async () => {
              if (!confirm('删掉 ' + (e.author || '') + ' 在 ' + e.date + ' 的日记？')) return;
              try {
                await api('DELETE', '/diary/' + e.date + '?author=' + encodeURIComponent(e.author || ''));
                toast('已删除');
                refresh();
              } catch (err) { toast(err.message, true); }
            },
          }),
        ]),
      ]),
    ]));
  });
}

/* ------------------------------ 留言 ------------------------------ */

/* ------------------------------ 游戏 ------------------------------ */

function renderGames(main) {
  bars(main, '游戏纪录', [
    h('button', {
      class: 'btn primary', text: '加/改纪录',
      onclick: async () => {
        const r = await modal('设置纪录', [
          { key: 'game', label: '游戏', type: 'select', options: GAME_OPTIONS, value: 'air' },
          { key: 'score', label: '分数', type: 'number' },
          { key: 'owner', label: '保持者', value: myName() },
        ], '保存');
        if (!r || !r.game) return;
        try {
          await api('PUT', '/game-records/' + r.game.trim(), {
            score: Number(r.score), owner: r.owner,
          });
          toast('已保存');
          refresh();
        } catch (e) { toast(e.message, true); }
      },
    }),
  ]);

  if (!state.games.length) return emptyBox(main, '还没有游戏纪录');

  state.games.forEach(g => {
    main.appendChild(h('div', { class: 'card' }, [
      h('div', { class: 'row' }, [
        h('div', { class: 'grow' }, [
          h('div', { class: 'title', text: gameLabel(g.game) }),
          h('div', { class: 'meta', text: g.owner + ' · ' + fmt(g.created_at) }),
        ]),
        h('div', { class: 'acts' }, [
          h('div', { style: 'font-size:20px;font-weight:700;margin-right:8px', text: String(g.score) }),
          h('button', {
            class: 'btn', text: '改',
            onclick: async () => {
              const r = await modal('改纪录 · ' + gameLabel(g.game), [
                { key: 'score', label: '分数', type: 'number', value: g.score },
                { key: 'owner', label: '保持者', value: g.owner },
              ], '保存');
              if (!r) return;
              try {
                await api('PUT', '/game-records/' + g.game, { score: Number(r.score), owner: r.owner });
                toast('已保存');
                refresh();
              } catch (e) { toast(e.message, true); }
            },
          }),
          h('button', {
            class: 'btn danger', text: '清空',
            onclick: async () => {
              if (!confirm('清掉' + gameLabel(g.game) + '的纪录？')) return;
              try {
                await api('DELETE', '/game-records/' + g.game);
                toast('已清空');
                refresh();
              } catch (e) { toast(e.message, true); }
            },
          }),
        ]),
      ]),
    ]));
  });
}

/* ============================== 启动 ============================== */

document.getElementById('chgkey').addEventListener('click', () => {
  localStorage.removeItem(KEY_STORE);
  KEY = '';
  showKeyGate();
});

if (KEY) refresh();
else showKeyGate();
